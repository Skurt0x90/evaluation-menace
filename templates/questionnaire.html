<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire — {{ nom }}</title>
<link rel="stylesheet" href="/static/style.min.css">
</head>
<body>
<div class="container">

  <div class="page-header">
    <div>
      <p class="label-sm">Questionnaire — Méthode S/E/I Entreprise</p>
      <h1>Appréciation de la Menace Cyber</h1>
      <p class="meta">{{ nom }}</p>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progress"></div>
  </div>

  <form action="/questionnaire" method="post" id="form">
    <input type="hidden" name="nom_deploiement" value="{{ nom }}">

    {% for bloc in blocs %}
    <div class="bloc">
      <div class="bloc-header">
        <span class="bloc-id">{{ bloc.id }}</span>
        <span class="bloc-title">{{ bloc.titre }}</span>
        <span class="bloc-desc">{{ bloc.description }}</span>
      </div>

      {% for q in bloc.questions %}
      <div class="question-card" id="card_{{ q.id }}">
        <p class="q-text">{{ q.texte }}</p>
        <p class="q-aide">{{ q.aide }}</p>
        <div class="options">
          {% for opt in q.options %}
          <label class="option-label" id="opt_{{ q.id }}_{{ opt.valeur }}">
            <input type="radio" name="{{ q.id }}" value="{{ opt.valeur }}"
                   onchange="pick('{{ q.id }}', {{ opt.valeur }})">
            <span class="lv-num lv{{ opt.valeur }}">{{ opt.valeur }}</span>
            <span>{{ opt.label }}</span>
          </label>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
    {% endfor %}

    <div class="submit-bar">
      <a href="/" class="btn btn-text">← Retour</a>
      <button type="submit" class="btn btn-filled">Calculer →</button>
    </div>
  </form>

</div>
<script>
function pick(qId, val) {
  document.querySelectorAll('[id^="opt_' + qId + '_"]').forEach(l => l.classList.remove('selected'));
  document.getElementById('opt_' + qId + '_' + val).classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const names = [...new Set([...document.querySelectorAll('input[type=radio]')].map(r => r.name))];
  const done  = new Set([...document.querySelectorAll('input[type=radio]:checked')].map(r => r.name)).size;
  document.getElementById('progress').style.width = (done / names.length * 100) + '%';
}

document.getElementById('form').addEventListener('submit', function(e) {
  const names   = [...new Set([...document.querySelectorAll('input[type=radio]')].map(r => r.name))];
  const missing = names.filter(n => !document.querySelector('input[name="' + n + '"]:checked'));
  if (missing.length) {
    e.preventDefault();
    alert(missing.length + ' question(s) sans réponse.');
    document.getElementById('card_' + missing[0]).scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});
</script>
</body>
</html>
